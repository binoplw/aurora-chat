name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: aurora-chat-jar
          path: build/libs/*-public.jar
          if-no-files-found: error

  game-test:
    # opens a real Minecraft client in a virtual display: the mod loads, chat, settings, translator work
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Client game test
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: build/run/clientGameTest/screenshots/
          if-no-files-found: ignore
